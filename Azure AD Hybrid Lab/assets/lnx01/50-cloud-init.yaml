network:
  version: 2
  ethernets:
    eth0:
      match:
        macaddress: "00:22:48:ba:a6:1f"
        driver: "hv_netvsc"
      dhcp4: true
      dhcp4-overrides:
        use-dns: false
        route-metric: 100
      dhcp6: false
      set-name: "eth0"
      nameservers:
       addresses:
        - 10.10.10.4
        - 172.16.100.2
