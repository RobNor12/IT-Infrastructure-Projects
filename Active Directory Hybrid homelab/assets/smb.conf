[global]
   workgroup = LAB
   realm = RNORRIS-LAB.LOCAL
   security = ads
   netbios name = robert-Ubuntu

   # ID Mapping configurations for Active Directory integration
   idmap config * : backend = tdb
   idmap config * : range = 3000-7999
   idmap config LAB : backend = rid
   idmap config LAB : range = 10000-999999

   # Winbind behavior settings
   winbind use default domain = yes
   winbind enum users = yes
   winbind enum groups = yes
   winbind offline logon = yes

   # Default template settings for domain users logging in
   template shell = /bin/bash
   template homedir = /home/%D/%U

   # Authentication settings
   dedicated keytab file = /etc/krb5.keytab
   kerberos method = secrets and keytab
